<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Nagpur GeoPortal | Sachin Chaudhari GIS</title>

<!-- ================= LEAFLET ================= -->

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<link rel="stylesheet"
href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css">

<link rel="stylesheet"
href="https://unpkg.com/leaflet-measure/dist/leaflet-measure.css">


<style>

/* ================================================= */
/* BASIC */
/* ================================================= */

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    font-family:Arial,Helvetica,sans-serif;
    overflow:hidden;
}


/* ================================================= */
/* HEADER */
/* ================================================= */

.header{

    height:145px;

    background:
    linear-gradient(
        135deg,
        #063970,
        #0b65a8,
        #1593d1
    );

    color:white;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    text-align:center;

    position:relative;

    z-index:3000;
}

.header h1{

    margin:5px 0;

    font-size:30px;

}

.header p{

    margin:3px 0;

    font-size:14px;

}


/* ================================================= */
/* TOOLBAR */
/* ================================================= */

.toolbar{

    height:48px;

    background:#ffffff;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:5px;

    padding:4px;

    box-shadow:
    0 2px 8px rgba(0,0,0,.25);

    position:relative;

    z-index:5000;

}

.toolbar button{

    border:none;

    background:#0b65a8;

    color:white;

    padding:8px 11px;

    border-radius:6px;

    cursor:pointer;

    font-size:12px;

    font-weight:bold;

}

.toolbar button:hover{

    background:#063970;

}


/* ================================================= */
/* GIS MENU */
/* ================================================= */

.menu-wrap{

    position:relative;

    display:inline-block;

}

.gis-panel{

    display:none;

    position:absolute;

    top:42px;

    left:0;

    width:260px;

    background:white;

    border-radius:9px;

    box-shadow:
    0 4px 18px rgba(0,0,0,.35);

    overflow:hidden;

    z-index:9999;

    border:1px solid #ddd;

}

.gis-panel.show{

    display:block;

}

.gis-title{

    background:#063970;

    color:white;

    padding:11px;

    font-size:14px;

    font-weight:bold;

}

.gis-panel label{

    display:block;

    padding:9px 12px;

    border-bottom:1px solid #eee;

    cursor:pointer;

    font-size:13px;

}

.gis-panel label:hover{

    background:#edf7ff;

}

.gis-panel input{

    margin-right:8px;

}


/* ================================================= */
/* PROPERTY SEARCH */
/* ================================================= */

.property-bar{

    position:absolute;

    top:202px;

    left:50%;

    transform:translateX(-50%);

    width:700px;

    max-width:
    calc(100% - 330px);

    background:
    rgba(255,255,255,.97);

    padding:8px;

    border-radius:9px;

    box-shadow:
    0 3px 15px rgba(0,0,0,.28);

    z-index:2500;

    display:flex;

    gap:5px;

}

.property-bar select,
.property-bar input{

    padding:8px;

    border:
    1px solid #bbb;

    border-radius:5px;

    font-size:12px;

}

.property-bar select{

    width:125px;

}

.property-bar input{

    flex:1;

}

.property-bar button{

    border:none;

    background:#198754;

    color:white;

    padding:8px 13px;

    border-radius:5px;

    cursor:pointer;

    font-weight:bold;

}


/* ================================================= */
/* MAP */
/* ================================================= */

#map{

    position:absolute;

    top:193px;

    bottom:32px;

    left:0;

    right:0;

    z-index:1;

}


/* ================================================= */
/* PROPERTY PANEL */
/* ================================================= */

.property-panel{

    position:absolute;

    top:260px;

    right:10px;

    width:315px;

    max-height:
    calc(100vh - 310px);

    background:white;

    border-radius:10px;

    box-shadow:
    0 4px 18px rgba(0,0,0,.30);

    overflow:hidden;

    z-index:2200;

}

.property-panel-header{

    background:
    linear-gradient(
        135deg,
        #198754,
        #0d6efd
    );

    color:white;

    padding:12px;

    font-weight:bold;

}

.property-list{

    max-height:
    calc(100vh - 360px);

    overflow-y:auto;

}

.property-card{

    padding:11px;

    border-bottom:
    1px solid #ddd;

    cursor:pointer;

}

.property-card:hover{

    background:#f0f8ff;

}

.property-card h4{

    margin:5px 0;

    font-size:14px;

    color:#063970;

}

.property-card p{

    margin:3px 0;

    font-size:12px;

}

.property-price{

    color:#198754;

    font-weight:bold;

}

.badge{

    display:inline-block;

    padding:3px 7px;

    border-radius:12px;

    color:white;

    font-size:10px;

    font-weight:bold;

}

.badge-sale{

    background:#198754;

}

.badge-rent{

    background:#0d6efd;

}

.badge-pg{

    background:#6f42c1;

}

.badge-approved{

    background:#198754;

}

.badge-proposed{

    background:#fd7e14;

}


/* ================================================= */
/* LAYOUT PANEL */
/* ================================================= */

.layout-panel{

    position:absolute;

    left:10px;

    top:260px;

    width:270px;

    max-height:
    calc(100vh - 310px);

    background:white;

    border-radius:10px;

    box-shadow:
    0 4px 18px rgba(0,0,0,.30);

    z-index:2100;

    overflow:hidden;

}

.layout-header{

    background:#6f42c1;

    color:white;

    padding:11px;

    font-weight:bold;

}

.layout-content{

    padding:10px;

    max-height:
    calc(100vh - 365px);

    overflow-y:auto;

}

.layout-content select,
.layout-content input{

    width:100%;

    padding:8px;

    margin-bottom:7px;

    border:
    1px solid #bbb;

    border-radius:5px;

    font-size:12px;

}

.layout-content button{

    width:100%;

    padding:8px;

    border:none;

    border-radius:5px;

    background:#6f42c1;

    color:white;

    font-weight:bold;

    cursor:pointer;

}

.layout-count{

    margin-top:8px;

    font-size:12px;

    font-weight:bold;

}


/* ================================================= */
/* COSTING BOX */
/* ================================================= */

.costing-box{

    margin-top:10px;

    padding:10px;

    background:#f4f8fb;

    border:
    1px solid #ddd;

    border-radius:7px;

}

.costing-box h4{

    margin:0 0 8px;

    color:#063970;

}

.costing-box input{

    width:100%;

    margin-bottom:6px;

}

.cost-result{

    margin-top:7px;

    padding:8px;

    background:#dff5e7;

    border-radius:5px;

    font-size:12px;

    font-weight:bold;

}


/* ================================================= */
/* POST PROPERTY */
/* ================================================= */

.post-property{

    position:absolute;

    left:15px;

    bottom:48px;

    background:#ff6b00;

    color:white;

    padding:12px 17px;

    border-radius:25px;

    font-weight:bold;

    cursor:pointer;

    box-shadow:
    0 4px 12px rgba(0,0,0,.3);

    z-index:2500;

}


/* ================================================= */
/* MODAL */
/* ================================================= */

.modal{

    display:none;

    position:fixed;

    left:0;

    top:0;

    width:100%;

    height:100%;

    background:
    rgba(0,0,0,.60);

    z-index:10000;

    align-items:center;

    justify-content:center;

}

.modal.show{

    display:flex;

}

.modal-content{

    width:500px;

    max-width:94%;

    max-height:90vh;

    overflow-y:auto;

    background:white;

    border-radius:12px;

    padding:20px;

}

.modal-header{

    display:flex;

    justify-content:space-between;

    align-items:center;

}

.modal-header h2{

    color:#063970;

}

.close-btn{

    background:#dc3545;

    color:white;

    border:none;

    width:30px;

    height:30px;

    border-radius:50%;

    cursor:pointer;

}

.form-group{

    margin-bottom:10px;

}

.form-group label{

    display:block;

    margin-bottom:4px;

    font-size:12px;

    font-weight:bold;

}

.form-group input,
.form-group select,
.form-group textarea{

    width:100%;

    padding:9px;

    border:
    1px solid #bbb;

    border-radius:5px;

}

.form-group textarea{

    height:70px;

}

.submit-btn{

    width:100%;

    padding:11px;

    background:#198754;

    color:white;

    border:none;

    border-radius:6px;

    font-weight:bold;

    cursor:pointer;

}


/* ================================================= */
/* FOOTER */
/* ================================================= */

.footer{

    position:absolute;

    left:0;

    right:0;

    bottom:0;

    height:32px;

    background:#063970;

    color:white;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:11px;

    z-index:3000;

}


/* ================================================= */
/* POPUP */
/* ================================================= */

.popup-box{

    min-width:230px;

}

.popup-box h3{

    margin:0 0 7px;

    color:#063970;

    font-size:15px;

}

.popup-box p{

    margin:4px 0;

    font-size:12px;

}

.popup-button{

    display:inline-block;

    padding:6px 9px;

    margin-top:6px;

    color:white;

    text-decoration:none;

    border-radius:5px;

    font-size:11px;

    font-weight:bold;

}

.call{

    background:#198754;

}

.whatsapp{

    background:#25D366;

}


/* ================================================= */
/* MOBILE */
/* ================================================= */

@media(max-width:900px){

    .header{

        height:120px;

    }

    .header h1{

        font-size:22px;

    }

    .toolbar{

        height:73px;

        flex-wrap:wrap;

    }

    .toolbar button{

        font-size:10px;

        padding:7px 8px;

    }

    .property-bar{

        top:202px;

        left:8px;

        transform:none;

        width:
        calc(100% - 16px);

        max-width:none;

        flex-wrap:wrap;

    }

    .property-bar select{

        width:31%;

    }

    .property-bar input{

        width:65%;

        flex:none;

    }

    .property-bar button{

        width:100%;

    }

    .layout-panel{

        top:auto;

        bottom:42px;

        left:5px;

        width:230px;

        max-height:40vh;

    }

    .layout-content{

        max-height:32vh;

    }

    .property-panel{

        top:auto;

        bottom:42px;

        right:5px;

        width:235px;

        max-height:40vh;

    }

    .property-list{

        max-height:32vh;

    }

    .gis-panel{

        left:auto;

        right:0;

        width:220px;

    }

}

@media(max-width:500px){

    .layout-panel{

        display:none;

    }

    .property-panel{

        width:220px;

    }

}

</style>

</head>

<!-- ================================================= -->
<!-- LEAFLET -->
<!-- ================================================= -->

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>

<script src="https://unpkg.com/leaflet-measure/dist/leaflet-measure.js"></script>


<script>

/* ================================================= */
/* MAP */
/* ================================================= */

var nagpur = [21.1458,79.0882];

var map =
    L.map("map")
     .setView(nagpur,12);


/* ================================================= */
/* BASE MAP */
/* ================================================= */

var osm =
    L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
            maxZoom:19,
            attribution:"© OpenStreetMap"
        }
    )
    .addTo(map);


var satellite =
    L.tileLayer(
        "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
        {
            maxZoom:19,
            attribution:"© Esri"
        }
    );


var street =
    L.tileLayer(
        "https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}",
        {
            maxZoom:19,
            attribution:"© Esri"
        }
    );


L.control.layers({

    "OpenStreetMap":osm,

    "Satellite":satellite,

    "Street Map":street

}).addTo(map);


/* ================================================= */
/* GEOCODER */
/* ================================================= */

L.Control.geocoder({

    defaultMarkGeocode:true

}).addTo(map);


/* ================================================= */
/* MEASURE */
/* ================================================= */

new L.Control.Measure({

    position:"topleft",

    primaryLengthUnit:"kilometers",

    secondaryLengthUnit:"meters",

    primaryAreaUnit:"hectares",

    secondaryAreaUnit:"sqmeters"

}).addTo(map);


/* ================================================= */
/* 45 KM BUFFER */
/* ================================================= */

var bufferLayer =
    L.layerGroup();


var buffer =
    L.circle(

        nagpur,

        {

            radius:45000,

            color:"#0066ff",

            weight:3,

            fillColor:"#3388ff",

            fillOpacity:0.05

        }

    )
    .bindPopup(
        "<b>Nagpur 45 KM Buffer</b><br>" +
        "Radius: 45 KM"
    );


buffer.addTo(bufferLayer);


/* ================================================= */
/* NAGPUR URBAN AREA */
/* ================================================= */

var urbanLayer =
    L.layerGroup();


var urbanPolygon =
    L.polygon(

        [

            [21.0800,79.0000],

            [21.2100,79.0000],

            [21.2100,79.1800],

            [21.0800,79.1800]

        ],

        {

            color:"#0066cc",

            weight:3,

            fillColor:"#00aaff",

            fillOpacity:0.10

        }

    )
    .bindPopup(
        "<b>Nagpur Urban Area</b><br>" +
        "Demo boundary - replace with official GIS boundary."
    );


urbanPolygon.addTo(urbanLayer);


/* ================================================= */
/* ADMIN BOUNDARY */
/* ================================================= */

var boundaryLayer =
    L.layerGroup();


L.polygon(

    [

        [21.0800,79.0000],

        [21.2100,79.0000],

        [21.2100,79.1800],

        [21.0800,79.1800]

    ],

    {

        color:"#6f42c1",

/* ================================================= */

function displayProperties(list){

    propertyLayer.clearLayers();


    var html="";


    list.forEach(function(p){


        var marker =
            L.marker(

                [p.lat,p.lng],

                {
                    icon:
                    propertyIcon(p.type)
                }

            );


        marker
        .bindPopup(
            propertyPopup(p)
        )
        .addTo(propertyLayer);


        var badge =
            p.type === "sale"
            ? "badge-sale"
            : p.type === "rent"
            ? "badge-rent"
            : "badge-pg";


        var text =
            p.type === "sale"
            ? "SALE"
            : p.type === "rent"
            ? "RENT"
            : "PG";


        html += `

            <div
                class="property-card"
                onclick="zoomToProperty(${p.id})">

                <span class="badge ${badge}">
                    ${text}
                </span>

                <h4>
                    ${p.title}
                </h4>

                <p>
                    📍 ${p.area}
                </p>

                <p>
                    📐 ${p.size}
                </p>

                <p class="property-price">
                    💰 ${p.price}
                </p>

                <p>
                    👤 ${p.owner}
                </p>

            </div>

        `;

    });


    document.getElementById(
        "propertyList"
    ).innerHTML=html;


    document.getElementById(
        "propertyCount"
    ).innerText=
        "(" + list.length + ")";

}


/* ================================================= */
/* PROPERTY SEARCH */
/* ================================================= */

function searchProperties(){

    var type =
        document.getElementById(
            "propertyType"
        ).value;


    var area =
        document.getElementById(
            "propertyArea"
        ).value;


    var keyword =
        document.getElementById(
            "propertyKeyword"
        ).value
        .toLowerCase()
        .trim();


    var result =
        properties.filter(function(p){

            var typeOK =
                type==="all"
                ||
                p.type===type;


            var areaOK =
                area==="all"
                ||
                p.area===area;


            var keywordOK =
                keyword===""
                ||
                p.title
                .toLowerCase()
                .includes(keyword)
                ||
                p.area
                .toLowerCase()
                .includes(keyword)
                ||
                p.owner
                .toLowerCase()
                .includes(keyword);


            return(
                typeOK &&
                areaOK &&
                keywordOK
            );

        });


    displayProperties(result);


    if(result.length){

        map.setView(

            [
                result[0].lat,
                result[0].lng
            ],

            14

        );

    }

}

    var result =

}

function searchLayouts(){

            "layoutType"
        ).value;


    var keyword =

            "layoutKeyword"
        ).value
        .toLowerCase()
        .trim();


    approvedLayer.clearLayers();

    proposedLayer.clearLayers();


    var result =
        layouts.filter(
            function(l){

                var statusOK =
                    status==="all"
                    ||
                    l.status===status;


                var typeOK =
                    type==="all"
                    ||
                    l.type===type;


                var keywordOK =
                    keyword===""
                    ||
                    l.name
                    .toLowerCase()
                    .includes(keyword)
                    ||
                    l.village
                    .toLowerCase()
                    .includes(keyword);


                return(
                    statusOK &&
                    typeOK &&
                    keywordOK
                );

            }
        );


    result.forEach(
        createLayoutMarker
    );


    document.getElementById(
        "layoutCount"
    ).innerText =
        "Layouts: " +
        result.length;


    if(result.length){

        map.setView(

            [
                result[0].lat,
                result[0].lng
            ],

            13

        );

    }

}


/* ================================================= */
/* COST CALCULATOR */
/* ================================================= */

function calculateCost(){

    var area =
        parseFloat(
            document.getElementById(
                "plotArea"
            ).value
        );


    var rate =
        parseFloat(
            document.getElementById(
                "plotRate"
            ).value
        );


    if(
        isNaN(area) ||
        isNaN(rate)
    ){

        alert(
            "Please enter Plot Area and Rate."
        );

        return;

    }


    var total =
        area * rate;


    document.getElementById(
        "costResult"
    ).innerHTML =

        "Estimated Cost: ₹" +

        total.toLocaleString(
            "en-IN"
        );

}


/* ================================================= */
/* GIS LAYER TOGGLE */
/* ================================================= */

function toggleLayer(name){

    var layer=null;


    if(name==="buffer")
        layer=bufferLayer;


    if(name==="urban")
        layer=urbanLayer;


    if(name==="approved")
        layer=approvedLayer;


    if(name==="proposed")
        layer=proposedLayer;


    if(name==="roads")
        layer=roadsLayer;


    if(name==="railway")
        layer=railwayLayer;


    if(name==="water")
        layer=waterLayer;


    if(name==="landuse")
        layer=landuseLayer;


    if(name==="boundary")
        layer=boundaryLayer;


    if(!layer)return;


    if(map.hasLayer(layer)){

        map.removeLayer(layer);

    }else{

        map.addLayer(layer);

    }

}

/* ================================================= */
/* MY LOCATION */
/* ================================================= */

function locateUser(){

    if(!navigator.geolocation){

        alert(
            "Geolocation not supported."
        );

        return;

    }


    navigator.geolocation.getCurrentPosition(

        function(position){

            var lat =
                position.coords.latitude;


            var lng =
                position.coords.longitude;


            map.setView(
                [lat,lng],
                15
            );


            L.marker(
                [lat,lng]
            )
            .addTo(map)
            .bindPopup(
                "📌 Your Location"
            )
            .openPopup();

        },

        function(){

            alert(
                "Unable to access location."
            );

        }

    );

}
